apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wallet-allow-ingress
spec:
  podSelector:
    matchLabels:
      app: wallet
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only allow traffic from pods labeled app=gateway (or your ingress controller)
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Postgres
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432